[project]
name = "type-safety-history-ml"
version = "0.1.0"
description = "Local-only document extraction and ML worker"
requires-python = ">=3.13"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.25,<2",
  "pyarrow>=19,<24",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
type-safety-ml-worker = "type_safety_ml.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/type_safety_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

