services:
  data-init:
    image: busybox:1.38
    command: [sh, -c, "chown 10001:10000 /data && chmod 2770 /data"]
    volumes:
      - app-data:/data

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: type_safety_history
      POSTGRES_USER: type_safety_history
      POSTGRES_PASSWORD: type_safety_history
    ports:
      - "5451:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U type_safety_history -d type_safety_history"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: containers/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://type_safety_history:type_safety_history@postgres:5432/type_safety_history
      DATA_ROOT: /data
      RUST_LOG: type_safety_history_api=info,tower_http=info
      CURATOR_TOKEN: ${CURATOR_TOKEN:?set CURATOR_TOKEN in .env}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:?set CROSSREF_MAILTO in .env}
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data
    group_add: ["10000"]
    depends_on:
      data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30

  ml-worker:
    build:
      context: .
      dockerfile: containers/ml.Dockerfile
    environment:
      DATABASE_URL: postgresql://type_safety_history:type_safety_history@postgres:5432/type_safety_history
      DATA_ROOT: /data
    volumes:
      - app-data:/data
    group_add: ["10000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  app-data:

