apiVersion: apps/v1
kind: Deployment
metadata:
  name: type-safety-history
  labels: { app.kubernetes.io/name: type-safety-history }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: type-safety-history }
  template:
    metadata:
      labels: { app.kubernetes.io/name: type-safety-history }
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.38
          command: [sh, -c, "until nc -z type-safety-history-db-rw 5432; do sleep 2; done"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 16Mi }
        - name: prepare-data-volume
          image: busybox:1.38
          command:
            - sh
            - -c
            - install -d -m 2770 -o 10001 -g 10000 /data/objects /data/derived /data/zarr /data/parquet /data/models /data/tmp
          securityContext:
            runAsUser: 0
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 16Mi }
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: type-safety-history-data }
      containers:
        - name: api
          image: example.invalid/type-safety-history-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: DATA_ROOT, value: /data }
            - { name: RUST_LOG, value: type_safety_history_api=info,tower_http=info }
            - name: CURATOR_TOKEN
              valueFrom: { secretKeyRef: { name: type-safety-history-config, key: curator-token } }
            - name: CROSSREF_MAILTO
              valueFrom: { secretKeyRef: { name: type-safety-history-config, key: crossref-mailto } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: type-safety-history-db-app, key: uri } }
          volumeMounts:
            - { name: data, mountPath: /data }
          startupProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 3
            failureThreshold: 100
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 10001
        - name: ml-worker
          image: example.invalid/type-safety-history-ml:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: DATA_ROOT, value: /data }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: type-safety-history-db-app, key: uri } }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1024Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 10002

