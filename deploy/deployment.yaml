apiVersion: apps/v1
kind: Deployment
metadata:
  name: type-safety-history
  labels: { app.kubernetes.io/name: type-safety-history }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: type-safety-history }
  template:
    metadata:
      labels: { app.kubernetes.io/name: type-safety-history }
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.38
          command: [sh, -c, "until nc -z type-safety-history-db-rw 5432; do sleep 2; done"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 16Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
        - name: prepare-data-volume
          image: busybox:1.38
          command:
            - sh
            - -c
            - >-
              install -d -m 2770
              /data/objects /data/derived /data/zarr
              /data/parquet /data/models /data/tmp &&
              chgrp 10000
              /data/objects /data/derived /data/zarr
              /data/parquet /data/models /data/tmp &&
              chmod 2770
              /data/objects /data/derived /data/zarr
              /data/parquet /data/models /data/tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsGroup: 10000
            runAsUser: 0
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 16Mi }
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: type-safety-history-data }
        - name: runtime-tmp
          emptyDir: { sizeLimit: 256Mi }
      containers:
        - name: api
          image: ${API_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: DATA_ROOT, value: /data }
            - { name: RUST_LOG, value: "type_safety_history_api=info,tower_http=info" }
            - name: CURATOR_TOKEN
              valueFrom: { secretKeyRef: { name: type-safety-history-config, key: curator-token } }
            - name: CROSSREF_MAILTO
              valueFrom: { secretKeyRef: { name: type-safety-history-config, key: crossref-mailto } }
            - name: OPENALEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: type-safety-history-config
                  key: openalex-api-key
                  optional: true
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: type-safety-history-db-app, key: uri } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: runtime-tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 3
            failureThreshold: 100
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
        - name: ml-worker
          image: ${ML_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - { name: DATA_ROOT, value: /data }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: type-safety-history-db-app, key: uri } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: runtime-tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1024Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002

