<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Type Safety History — Proof graph</title>
  <style>
    :root{--ink:#18212b;--muted:#687482;--paper:#f4f1e9;--card:#fffdf8;--line:#d8d2c4;--blue:#285f8f;--green:#39755a;--gold:#a66b19;--red:#a64536}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,sans-serif}
    main{max-width:1500px;margin:auto;padding:32px 24px 64px} header{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:20px}
    h1{font:700 34px/1.05 ui-serif,Georgia,serif;margin:0 0 8px} h2{font:700 21px ui-serif,Georgia,serif;margin:0 0 12px} p{margin:0;color:var(--muted)}
    a{color:var(--blue)} .toolbar,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
    .toolbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.toolbar strong{margin-right:auto}.toolbar label{display:flex;gap:7px;align-items:center}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}.canvas{overflow:auto;max-height:75vh;padding:0}.canvas svg{display:block;min-width:1050px}
    .detail{align-self:start;position:sticky;top:14px;overflow-wrap:anywhere}.detail dl{display:grid;grid-template-columns:100px 1fr;gap:7px 10px}.detail dt{color:var(--muted)}.detail dd{margin:0}
    .badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#a66b1918;color:#71470d;font-size:12px}.badge.confirmed{background:#39755a18;color:#285a42}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
    button{font:inherit;text-align:left;border:0;background:transparent;cursor:pointer} .empty{padding:50px;text-align:center;color:var(--muted)}
    @media(max-width:900px){header{display:block}.layout{display:block}.detail{position:static}.canvas{max-height:60vh}}
  </style>
</head>
<body><main>
  <header><div><h1>Proof history graph</h1><p>Local ML findings are published automatically and visibly distinguished from manual confirmation.</p></div>
    <p><a href="/dashboard">Dashboard</a> · <a href="/curate">Optional review</a> · <a href="/docs">API docs</a></p></header>
  <section class="toolbar">
    <strong id="summary">Loading graph…</strong>
    <label><input id="machine" type="checkbox" checked> Machine-classified</label>
    <label><input id="confirmed" type="checkbox" checked> Curator-confirmed</label>
    <label>Search <input id="search" type="search" placeholder="paper or proof"></label>
    <span class="legend"><span><i class="dot" style="background:var(--blue)"></i>work</span><span><i class="dot" style="background:var(--gold)"></i>machine</span><span><i class="dot" style="background:var(--green)"></i>confirmed</span><span><i class="dot" style="background:var(--red)"></i>obligation</span></span>
  </section>
  <div class="layout">
    <section class="panel canvas" id="canvas"><div class="empty">Loading…</div></section>
    <aside class="panel detail"><h2>Selection</h2><div id="detail"><p>Select a proof node to inspect its provenance and evidence.</p></div></aside>
  </div>
</main>
<script>
const NS='http://www.w3.org/2000/svg'; let data={nodes:[],edges:[]};
const byId=()=>new Map(data.nodes.map(n=>[n.id,n]));
function el(name,attrs={},text=''){const node=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));if(text)node.textContent=text;return node}
function show(node){const target=document.getElementById('detail');target.replaceChildren();const title=document.createElement('h2');title.textContent=node.label;target.append(title);const badge=document.createElement('span');badge.className='badge'+(node.verification_status==='curator_approved'?' confirmed':'');badge.textContent=node.verification_status==='curator_approved'?'Curator-confirmed':'Machine-classified';target.append(badge);const dl=document.createElement('dl');const fields=[['Result',node.result_kind?.replaceAll('_',' ')],['Method',node.proof_method?.replaceAll('_',' ')],['Summary',node.statement_summary],['Year',node.publication_year],['DOI',node.doi],['Confidence',node.confidence==null?null:node.confidence.toFixed(3)],['Classifier',node.classifier_version],['Pages',node.page_start==null?null:(node.page_end&&node.page_end!==node.page_start?node.page_start+'–'+node.page_end:String(node.page_start))],['Document',node.source_document_id],['Evidence hash',node.content_sha256],['Evidence',node.evidence_paraphrase]];fields.forEach(([key,value])=>{if(value==null||value==='')return;const dt=document.createElement('dt');dt.textContent=key;const dd=document.createElement('dd');dd.textContent=value;dl.append(dt,dd)});target.append(dl)}
function render(){const nodes=byId(), machine=document.getElementById('machine').checked, confirmed=document.getElementById('confirmed').checked, query=document.getElementById('search').value.trim().toLowerCase();const proofs=data.nodes.filter(n=>n.kind==='proof'&&((machine&&n.verification_status==='machine_classified')||(confirmed&&n.verification_status==='curator_approved')));const visible=proofs.filter(p=>{const edge=data.edges.find(e=>e.target===p.id&&e.kind==='reports');const work=edge&&nodes.get(edge.source);return !query||p.label.toLowerCase().includes(query)||(work&&work.label.toLowerCase().includes(query))});document.getElementById('summary').textContent=`${visible.length} proof assertions shown`;const canvas=document.getElementById('canvas');canvas.replaceChildren();if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No matching proofs.';canvas.append(empty);return}const row=72,width=1120,height=visible.length*row+70,svg=el('svg',{viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':'Graph connecting papers to proof claims and obligations'});svg.append(el('text',{x:25,y:28,fill:'#687482','font-size':12},'PAPERS'),el('text',{x:475,y:28,fill:'#687482','font-size':12},'PROOF ASSERTIONS'),el('text',{x:910,y:28,fill:'#687482','font-size':12},'OBLIGATIONS'));visible.forEach((proof,index)=>{const y=62+index*row,report=data.edges.find(e=>e.target===proof.id&&e.kind==='reports'),work=report&&nodes.get(report.source),obligationEdges=data.edges.filter(e=>e.source===proof.id&&e.kind==='establishes'),color=proof.verification_status==='curator_approved'?'#39755a':'#a66b19';svg.append(el('line',{x1:320,y1:y,x2:470,y2:y,stroke:'#c8c1b3','stroke-width':1.5}));obligationEdges.forEach((edge,i)=>{const oy=y+(i-(obligationEdges.length-1)/2)*20;svg.append(el('line',{x1:750,y1:y,x2:905,y2:oy,stroke:color,'stroke-opacity':.45,'stroke-width':1.5}),el('circle',{cx:920,cy:oy,r:6,fill:'#a64536'}),el('text',{x:934,y:oy+4,fill:'#18212b','font-size':12},nodes.get(edge.target)?.label||edge.target))});svg.append(el('circle',{cx:38,cy:y,r:8,fill:'#285f8f'}),el('text',{x:54,y:y-5,fill:'#18212b','font-size':13},(work?.label||'Unknown work').slice(0,43)),el('text',{x:54,y:y+13,fill:'#687482','font-size':11},work?.publication_year||'year unknown'));const group=el('g',{tabindex:0,role:'button','aria-label':`Inspect ${proof.label}`});group.style.cursor='pointer';group.append(el('rect',{x:470,y:y-22,width:280,height:44,rx:8,fill:color,'fill-opacity':.12,stroke:color}),el('circle',{cx:487,cy:y,r:7,fill:color}),el('text',{x:502,y:y-3,fill:'#18212b','font-size':13},proof.label.slice(0,35)),el('text',{x:502,y:y+13,fill:'#687482','font-size':11},proof.verification_status==='curator_approved'?'curator-confirmed':`machine · ${proof.confidence==null?'confidence unknown':proof.confidence.toFixed(2)}`));group.addEventListener('click',()=>show({...proof,publication_year:work?.publication_year,doi:work?.doi}));group.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();show({...proof,publication_year:work?.publication_year,doi:work?.doi})}});svg.append(group)});canvas.append(svg)}
['machine','confirmed','search'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));
fetch('/api/v1/graph').then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}).then(value=>{data=value;render()}).catch(error=>{const canvas=document.getElementById('canvas');canvas.replaceChildren();const empty=document.createElement('div');empty.className='empty';empty.textContent=`Could not load graph: ${error.message}`;canvas.append(empty);document.getElementById('summary').textContent='Graph unavailable'});
</script></body></html>
