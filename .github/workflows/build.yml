name: build
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: type_safety_history
          POSTGRES_USER: type_safety_history
          POSTGRES_PASSWORD: type_safety_history
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U type_safety_history"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://type_safety_history:type_safety_history@localhost:5432/type_safety_history
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify migrations and readiness
        env:
          DATA_ROOT: /tmp/type-safety-history-ci-data
          PORT: "8081"
          CURATOR_TOKEN: ci-only-token
        run: |
          cargo run -p type-safety-history-api > /tmp/type-safety-history-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8081/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/type-safety-history-api.log
          exit 1

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --project ml --all-groups
      - run: uv run --project ml ruff format --check scripts ml
      - run: uv run --project ml ruff check ml
      - run: uv run --project ml ruff check scripts
      - run: uv run --project ml pytest

  end-to-end:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: type_safety_history
          POSTGRES_USER: type_safety_history
          POSTGRES_PASSWORD: type_safety_history
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U type_safety_history"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://type_safety_history:type_safety_history@localhost:5432/type_safety_history
      DATA_ROOT: /tmp/type-safety-history-e2e-data
      CURATOR_TOKEN: ci-only-token
      PORT: "8081"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: uv sync --project ml --all-groups
      - run: target/debug/type-safety-history-api seed fixtures/seed-works.json
      - name: Exercise API, worker, lifecycle, and dashboard
        run: |
          target/debug/type-safety-history-api > /tmp/type-safety-history-api.log 2>&1 &
          api_pid=$!
          WORKER_ID=ci-worker-1 uv run --project ml type-safety-ml-worker > /tmp/type-safety-history-worker-1.log 2>&1 &
          worker_1_pid=$!
          WORKER_ID=ci-worker-2 uv run --project ml type-safety-ml-worker > /tmp/type-safety-history-worker-2.log 2>&1 &
          worker_2_pid=$!
          trap 'kill "$api_pid" "$worker_1_pid" "$worker_2_pid" || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8081/health/ready; then
              python3 scripts/e2e.py
              target/debug/type-safety-history-api verify-storage
              exit 0
            fi
            sleep 1
          done
          cat /tmp/type-safety-history-api.log
          cat /tmp/type-safety-history-worker-1.log
          cat /tmp/type-safety-history-worker-2.log
          exit 1

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - run: kubectl kustomize db >/dev/null
      - run: kubectl kustomize deploy >/dev/null

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f containers/api.Dockerfile -t type-safety-history-api:test .
      - run: docker build -f containers/ml.Dockerfile -t type-safety-history-ml:test .

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Vulnerability, secret, licence, and configuration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.76.2
      - name: Generate SPDX SBOM
        if: always()
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: type-safety-history.spdx.json
          upload-artifact: true

  release-metadata:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, python, end-to-end, manifests, containers, supply-chain]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - id: release
        name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: containers/api.Dockerfile
          - component: ml
            dockerfile: containers/ml.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish ${{ matrix.component }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ needs.release-metadata.outputs.tag }}-${{ matrix.component }}
            ${{ vars.DOCKERHUB_REPOSITORY }}:latest-${{ matrix.component }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.tag }}
            org.opencontainers.image.title=type-safety-history-${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

  github-release:
    needs: [release-metadata, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          args=("$TAG" --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
