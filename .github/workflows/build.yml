name: build
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - id: release
        name: Validate release context
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
              exit 1
            fi
            release=true
            tag=$REF_NAME
            if [[ "$REF_NAME" == *-* ]]; then
              prerelease=true
            else
              prerelease=false
            fi
          else
            release=false
            tag="ci-${SHA:0:12}"
            prerelease=false
          fi
          {
            echo "release=$release"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: type_safety_history
          POSTGRES_USER: type_safety_history
          POSTGRES_PASSWORD: type_safety_history
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U type_safety_history"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://type_safety_history:type_safety_history@localhost:5432/type_safety_history
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify migrations and readiness
        env:
          DATA_ROOT: /tmp/type-safety-history-ci-data
          PORT: "8081"
          CURATOR_TOKEN: ci-only-token
        run: |
          cargo run -p type-safety-history-api > /tmp/type-safety-history-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8081/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/type-safety-history-api.log
          exit 1

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --project ml --all-groups
      - run: uv run --project ml ruff format --check scripts ml
      - run: uv run --project ml ruff check ml
      - run: uv run --project ml ruff check scripts
      - run: uv run --project ml pytest

  end-to-end:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: type_safety_history
          POSTGRES_USER: type_safety_history
          POSTGRES_PASSWORD: type_safety_history
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U type_safety_history"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://type_safety_history:type_safety_history@localhost:5432/type_safety_history
      DATA_ROOT: /tmp/type-safety-history-e2e-data
      CURATOR_TOKEN: ci-only-token
      PORT: "8081"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: uv sync --project ml --all-groups
      - run: target/debug/type-safety-history-api seed fixtures/seed-works.json
      - name: Exercise API, worker, lifecycle, and dashboard
        run: |
          target/debug/type-safety-history-api > /tmp/type-safety-history-api.log 2>&1 &
          api_pid=$!
          WORKER_ID=ci-worker-1 uv run --project ml type-safety-ml-worker > /tmp/type-safety-history-worker-1.log 2>&1 &
          worker_1_pid=$!
          WORKER_ID=ci-worker-2 uv run --project ml type-safety-ml-worker > /tmp/type-safety-history-worker-2.log 2>&1 &
          worker_2_pid=$!
          trap 'kill "$api_pid" "$worker_1_pid" "$worker_2_pid" || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8081/health/ready; then
              python3 scripts/e2e.py
              target/debug/type-safety-history-api verify-storage
              exit 0
            fi
            sleep 1
          done
          cat /tmp/type-safety-history-api.log
          cat /tmp/type-safety-history-worker-1.log
          cat /tmp/type-safety-history-worker-2.log
          exit 1

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - run: kubectl kustomize db >/dev/null
      - run: kubectl kustomize deploy >/dev/null

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Vulnerability, secret, licence, and configuration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.76.2
      - name: Generate SPDX SBOM
        if: always()
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: type-safety-history.spdx.json
          upload-artifact: true

  containers:
    needs: [release-context, rust, python, end-to-end, manifests, supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: containers/api.Dockerfile
          - component: ml
            dockerfile: containers/ml.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Sign in to Docker Hub
        if: needs.release-context.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: image
        name: Select image tags
        env:
          COMPONENT: ${{ matrix.component }}
          RELEASE: ${{ needs.release-context.outputs.release }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" = true ]; then
            {
              echo 'tags<<EOF'
              echo "$REPOSITORY:$RELEASE_TAG-$COMPONENT"
              echo "$REPOSITORY:latest-$COMPONENT"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=type-safety-history-$COMPONENT:$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Build ${{ matrix.component }} image${{ needs.release-context.outputs.release == 'true' && ' and publish' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ needs.release-context.outputs.release == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-context.outputs.tag }}
            org.opencontainers.image.title=type-safety-history-${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: ${{ needs.release-context.outputs.release == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.release-context.outputs.release == 'true' }}

  github-release:
    if: needs.release-context.outputs.release == 'true'
    needs: [release-context, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-context.outputs.tag }}
          PRERELEASE: ${{ needs.release-context.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          args=("$TAG" --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
