name: deploy
run-name: "deploy production @ ${{ inputs.tag }}"

on:
  workflow_call:
    inputs:
      tag:
        description: Published tag to deploy, for example v1.0.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag to deploy, for example v1.0.0
        required: true
        type: string

concurrency:
  group: type-safety-history-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://type-safety-history.sthomas.ch
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Join the homelab network
        uses: SebastianThomas/homelab-actions/headscale-connect@v1
        with:
          auth-key: ${{ secrets.TS_AUTHKEY }}
          login-server: ${{ secrets.HEADSCALE_URL }}
          ping: kube-cp-01
          hostname: gha-type-safety-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Reconcile CNPG database
        uses: SebastianThomas/homelab-actions/cnpg-cluster@v1
        with:
          server: ${{ secrets.KUBE_API }}
          ca: ${{ secrets.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: type-safety-history
          manifests: db
          timeout: 900s

      - name: Reconcile application configuration
        uses: SebastianThomas/homelab-actions/kube-secret@v1
        with:
          server: ${{ secrets.KUBE_API }}
          ca: ${{ secrets.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: type-safety-history
          name: type-safety-history-config
          literals: |
            curator-token=${{ secrets.CURATOR_TOKEN }}
            crossref-mailto=${{ vars.CROSSREF_MAILTO }}
            openalex-api-key=${{ secrets.OPENALEX_API_KEY }}

      - name: Deploy application
        uses: SebastianThomas/homelab-actions/kube-deploy@v1
        with:
          server: ${{ secrets.KUBE_API }}
          ca: ${{ secrets.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: type-safety-history
          manifests: deploy
          images: |
            API_IMAGE=${{ vars.DOCKERHUB_REPOSITORY }}:${{ inputs.tag }}-api
            ML_IMAGE=${{ vars.DOCKERHUB_REPOSITORY }}:${{ inputs.tag }}-ml
          rollouts: |
            deployment/type-safety-history-api
            deployment/type-safety-history-worker
          rollout-timeout: 600s

      - name: Remove superseded combined Deployment
        run: |
          set -euo pipefail
          kubectl -n type-safety-history delete deployment type-safety-history --ignore-not-found
